# ModernFix per-mixin overrides.
#
# dedicated_reload_executor: DISABLED (client crash fix).
# ModernFix's dedicated reload executor fans resource reloading out across a
# pool of worker threads. AzureLib (3.0.39) bakes its animations on that pool
# but evaluates Molang expressions through a SHARED MolangParser whose variable
# map is a non-thread-safe Object2ObjectOpenHashMap. Concurrent baking corrupts
# the map -> "ArrayIndexOutOfBoundsException: Index -1 ... rehash" floods the
# log during reload (caught there as "Failed to convert object to value:
# v.head_rot_x"), and the poisoned parser later hard-crashes the render thread
# the next time an AzureLib entity is drawn (observed: samurai_dynasty:enenra
# via GeoEntityRenderer). Turning the dedicated executor off serializes the
# reload enough that AzureLib's parser is no longer raced. Costs a little world-
# load time; trades it for not crashing. Remove this once AzureLib ships a
# thread-safe MolangParser (then a straight azurelib version bump is the real
# fix and this override can go).
mixin.perf.dedicated_reload_executor=false
